{{- $image := partial "boundary-image.html" (dict "src" .full) -}}
<a class="lightbox-trigger" href="{{ .full }}" data-lightbox data-full="{{ .full }}" data-caption="{{ .title }}"{{ with .desc }} data-desc="{{ . }}"{{ end }}>
  <img src="{{ $image.src }}" srcset="{{ $image.srcset }}" sizes="(max-width: 767px) 100vw, 60vw" width="{{ $image.width }}" height="{{ $image.height }}" data-original="{{ .full }}" data-thumb="{{ $image.thumb }}" data-caption="{{ .title }}" alt="{{ .alt }}" loading="lazy" decoding="async">
</a>
