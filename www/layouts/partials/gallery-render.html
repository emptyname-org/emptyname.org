{{- /* Full linked gallery is the baseline. Boundary JS enhances it after startup. */ -}}
{{- with .items }}
<div class="gallery" data-gallery>
  <div class="gallery-stage">
  {{- range $i, $it := . }}
    {{- $image := partial "boundary-image.html" (dict "src" $it.src) -}}
    <a class="gallery-original" href="{{ $it.src }}" aria-label="{{ $it.cap }}"><img class="gallery-full" src="{{ $image.src }}" srcset="{{ $image.srcset }}" sizes="(max-width: 767px) 100vw, 60vw" width="{{ $image.width }}" height="{{ $image.height }}" data-original="{{ $it.src }}" data-thumb="{{ $image.thumb }}" alt="{{ $it.alt }}" data-caption="{{ $it.cap }}"{{ with $it.artworkURL }} data-artwork-url="{{ . }}"{{ end }} loading="lazy" decoding="async"><span class="fallback-caption" data-caption="{{ $it.cap }}" aria-hidden="true"></span></a>
  {{- end }}
  </div>
  <p class="gallery-caption" aria-live="polite"></p>
</div>
{{- end -}}
